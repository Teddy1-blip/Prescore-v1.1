name: prescore-rc1
x-runtime: &runtime
  image: prescore:rc1
  build:
    context: .
    args:
      SOURCE_SHA: ${PRESCORE_SOURCE_SHA:-UNKNOWN}
      BUILD_TIMESTAMP: ${PRESCORE_BUILD_TIMESTAMP:-UNKNOWN}
  env_file: .env.rc
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  stop_grace_period: 25s
  volumes:
    - documents:/data/prescore
services:
  postgres:
    image: postgres:15-bookworm
    environment:
      POSTGRES_DB: prescore_rc
      POSTGRES_USER: prescore_rc
      POSTGRES_PASSWORD: ${RC_POSTGRES_PASSWORD:?Set RC_POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U prescore_rc -d prescore_rc]
      interval: 3s
      timeout: 3s
      retries: 30
  migrate:
    <<: *runtime
    command: [node, --experimental-strip-types, scripts/platform/db-migrate.mjs]
    depends_on:
      postgres: {condition: service_healthy}
  prescore-app:
    <<: *runtime
    ports: [127.0.0.1:3000:3000]
    depends_on:
      migrate: {condition: service_completed_successfully}
  prescore-worker:
    <<: *runtime
    command: [node, --experimental-strip-types, scripts/billing/payout-worker.mjs]
    healthcheck:
      test: [CMD, node, --experimental-strip-types, scripts/release/worker-ready.mjs]
      interval: 15s
      timeout: 5s
      start_period: 20s
    depends_on:
      prescore-app: {condition: service_healthy}
volumes:
  postgres-data:
  documents:
