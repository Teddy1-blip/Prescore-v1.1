name: Deliver Prescore RC3 staging to Amvera

on:
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: prescore-amvera-staging-live-v3
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  validate-and-deliver:
    if: github.repository == 'Teddy1-blip/Prescore-v1.1' && github.ref == 'refs/heads/staging'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 90
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Resolve Python runtime
        run: |
          $python = Get-Command python -ErrorAction SilentlyContinue
          if ($python) {
            "PRESCORE_PYTHON=$($python.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            & $python.Source --version
            exit 0
          }
          $py = Get-Command py -ErrorAction SilentlyContinue
          if ($py) {
            "PRESCORE_PYTHON=$($py.Source)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "PRESCORE_PYTHON_ARGS=-3" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            & $py.Source -3 --version
            exit 0
          }
          $root = Join-Path $env:RUNNER_TEMP 'prescore-python'
          $zip = Join-Path $env:RUNNER_TEMP 'python-embed.zip'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Invoke-WebRequest -Uri 'https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip' -OutFile $zip
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $exe = Join-Path $root 'python.exe'
          if (-not (Test-Path $exe)) { throw 'Portable Python extraction failed.' }
          "PRESCORE_PYTHON=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $exe --version

      - name: Authenticated read-only Amvera access check
        env:
          AMVERA_USERNAME: ${{ secrets.AMVERA_USERNAME }}
          AMVERA_PASSWORD: ${{ secrets.AMVERA_PASSWORD }}
          AMVERA_GIT_URL: ${{ secrets.AMVERA_GIT_URL }}
        run: |
          if ($env:PRESCORE_PYTHON_ARGS) { & $env:PRESCORE_PYTHON $env:PRESCORE_PYTHON_ARGS scripts/deploy/amvera.py access }
          else { & $env:PRESCORE_PYTHON scripts/deploy/amvera.py access }

      - name: Delivery script tests
        run: |
          if ($env:PRESCORE_PYTHON_ARGS) { & $env:PRESCORE_PYTHON $env:PRESCORE_PYTHON_ARGS -m unittest discover -s tests/deploy -p 'test_*.py' }
          else { & $env:PRESCORE_PYTHON -m unittest discover -s tests/deploy -p 'test_*.py' }

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build exact staging tree
        run: |
          npm run build
          node scripts/release/package-runtime.mjs

      - name: Validate deployable artifact
        run: npm run validate:artifact

      - name: Read Amvera history and prepare exact source tree
        env:
          AMVERA_USERNAME: ${{ secrets.AMVERA_USERNAME }}
          AMVERA_PASSWORD: ${{ secrets.AMVERA_PASSWORD }}
          AMVERA_GIT_URL: ${{ secrets.AMVERA_GIT_URL }}
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          if ($env:PRESCORE_PYTHON_ARGS) { & $env:PRESCORE_PYTHON $env:PRESCORE_PYTHON_ARGS scripts/deploy/amvera.py prepare }
          else { & $env:PRESCORE_PYTHON scripts/deploy/amvera.py prepare }

      - name: Verify local staging rollback bundle
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'prescore-delivery\backup'
          $manifest = Get-Content (Join-Path $root 'manifest.json') -Raw | ConvertFrom-Json
          if (-not $manifest.empty_remote -and -not (Test-Path (Join-Path $root 'amvera-history.bundle'))) {
            throw 'Amvera rollback bundle is missing.'
          }
          Write-Host 'STAGING_HISTORY_BACKUP_VERIFIED'

      - name: Fast-forward Amvera master only
        env:
          AMVERA_USERNAME: ${{ secrets.AMVERA_USERNAME }}
          AMVERA_PASSWORD: ${{ secrets.AMVERA_PASSWORD }}
          AMVERA_GIT_URL: ${{ secrets.AMVERA_GIT_URL }}
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          if ($env:PRESCORE_PYTHON_ARGS) { & $env:PRESCORE_PYTHON $env:PRESCORE_PYTHON_ARGS scripts/deploy/amvera.py push }
          else { & $env:PRESCORE_PYTHON scripts/deploy/amvera.py push }

      - name: Verify live staging runtime
        env:
          GH_READ_TOKEN: ${{ github.token }}
          AMVERA_USERNAME: ${{ secrets.AMVERA_USERNAME }}
          AMVERA_PASSWORD: ${{ secrets.AMVERA_PASSWORD }}
          AMVERA_GIT_URL: ${{ secrets.AMVERA_GIT_URL }}
        run: |
          if ($env:PRESCORE_PYTHON_ARGS) { & $env:PRESCORE_PYTHON $env:PRESCORE_PYTHON_ARGS scripts/deploy/amvera.py live }
          else { & $env:PRESCORE_PYTHON scripts/deploy/amvera.py live }
