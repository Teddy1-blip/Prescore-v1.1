name: Prescore RC1
run-name: "Prescore RC1 / ${{ inputs.candidate_sha || github.sha }}"
on:
  push:
    branches: [prescore-live-product-recovery-v1]
    paths:
      - '.github/workflows/prescore-rc1.yml'
      - '.github/workflows/prescore-product-qa.yml'
      - 'app/**'
      - 'lib/**'
      - 'scripts/**'
      - 'tests/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'proxy.ts'
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: 'Full commit SHA in this repository to test; empty tests the selected ref'
        required: false
        type: string
permissions:
  contents: read
  actions: read
env:
  NEXT_TELEMETRY_DISABLED: '1'
concurrency:
  group: prescore-rc1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tree: ${{ steps.source.outputs.tree }}
      timestamp: ${{ steps.source.outputs.timestamp }}
      selection: ${{ steps.source.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
      - name: Resolve exact test commit in this repository
        id: source
        run: node scripts/release/ci-candidate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

  static:
    needs: candidate
    env:
      PRESCORE_TEST_SHA: ${{ needs.candidate.outputs.sha }}
      PRESCORE_CANDIDATE_SELECTION: ${{ needs.candidate.outputs.selection }}
      RC_BUILD_TIMESTAMP: ${{ needs.candidate.outputs.timestamp }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ needs.candidate.outputs.sha }}", persist-credentials: false}
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$PRESCORE_TEST_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '22'}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build && node scripts/release/package-runtime.mjs
      - run: npm run validate:artifact
      - run: node scripts/platform/pdf-artifact-smoke.mjs
      - run: node scripts/release/dependency-audit.mjs
        env: {RC_REPORT_DIR: '${{ runner.temp }}/rc-reports'}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && vars.PRESCORE_UPLOAD_EVIDENCE == '1'
        with:
          name: rc-static-${{ needs.candidate.outputs.sha }}
          path: ${{ runner.temp }}/rc-reports/*.json
          if-no-files-found: error
  product-regression:
    needs: candidate
    env:
      PRESCORE_TEST_SHA: ${{ needs.candidate.outputs.sha }}
      PRESCORE_CANDIDATE_SELECTION: ${{ needs.candidate.outputs.selection }}
      RC_BUILD_TIMESTAMP: ${{ needs.candidate.outputs.timestamp }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ needs.candidate.outputs.sha }}", persist-credentials: false}
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$PRESCORE_TEST_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '22'}
      - run: node scripts/release/wait-product.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RC_REPORT_DIR: ${{ runner.temp }}/rc-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && vars.PRESCORE_UPLOAD_EVIDENCE == '1'
        with:
          name: rc-product-${{ needs.candidate.outputs.sha }}
          path: ${{ runner.temp }}/rc-reports/*.json
          if-no-files-found: error
  postgres:
    needs: candidate
    name: postgres-${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: {scenario: [clean-e2e-restore, upgrade, worker]}
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: rc
          POSTGRES_PASSWORD: synthetic-ci-only-password
          POSTGRES_DB: prescore_rc_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U rc -d prescore_rc_ci"
          --health-interval 3s --health-timeout 3s --health-retries 30
    env:
      PRESCORE_TEST_SHA: ${{ needs.candidate.outputs.sha }}
      PRESCORE_CANDIDATE_SELECTION: ${{ needs.candidate.outputs.selection }}
      RC_BUILD_TIMESTAMP: ${{ needs.candidate.outputs.timestamp }}
      DATABASE_URL: postgresql://rc:synthetic-ci-only-password@127.0.0.1:5432/prescore_rc_ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ needs.candidate.outputs.sha }}", persist-credentials: false}
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$PRESCORE_TEST_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '22'}
      - run: npm ci
      - run: node scripts/release/ci-environment.mjs
      - name: Clean migrations / upgrade preservation
        run: node --experimental-strip-types scripts/release/database-scenarios.mjs "${{ matrix.scenario == 'upgrade' && 'upgrade' || 'clean' }}"
      - run: npm run db:verify
      - name: Actual worker concurrency / crash / lease / SIGTERM
        if: matrix.scenario == 'worker'
        run: |
          node --experimental-strip-types scripts/release/worker-scenarios.mjs
          node --experimental-strip-types scripts/release/storage-crash.mjs
      - name: Production standalone build
        if: matrix.scenario != 'worker'
        run: npm run build && node scripts/release/package-runtime.mjs
      - name: PostgreSQL 17 backup tools and Chromium
        if: matrix.scenario != 'worker'
        run: |
          sudo install -d -m 0755 /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          # Select the installed 17 binaries, not the runner's default pg_wrapper cluster.
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"
          for pg_tool in pg_dump pg_restore psql; do
            test "$(command -v "$pg_tool")" = "/usr/lib/postgresql/17/bin/$pg_tool"
            pg_version="$("$pg_tool" --version)"
            echo "$pg_version"
            echo "$pg_version" | grep -Eq ' 17\.'
          done
          npx --no-install playwright install --with-deps chromium
      - name: Real HTTP E2E / restart / clean restore / post-restore E2E
        if: matrix.scenario != 'worker'
        run: node --experimental-strip-types scripts/release/e2e.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && vars.PRESCORE_UPLOAD_EVIDENCE == '1'
        with:
          name: rc-${{ matrix.scenario }}-${{ needs.candidate.outputs.sha }}
          path: |
            ${{ runner.temp }}/rc-reports/*.json
            ${{ runner.temp }}/rc-reports/*.png
          if-no-files-found: error
  container:
    needs: candidate
    env:
      PRESCORE_TEST_SHA: ${{ needs.candidate.outputs.sha }}
      PRESCORE_CANDIDATE_SELECTION: ${{ needs.candidate.outputs.selection }}
      RC_BUILD_TIMESTAMP: ${{ needs.candidate.outputs.timestamp }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ needs.candidate.outputs.sha }}", persist-credentials: false}
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$PRESCORE_TEST_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '22'}
      - run: docker build --build-arg SOURCE_SHA="${{ needs.candidate.outputs.sha }}" --build-arg BUILD_TIMESTAMP="${{ needs.candidate.outputs.timestamp }}" -t prescore:rc1 .
      - run: node scripts/release/container-smoke.mjs
        env: {RC_REPORT_DIR: '${{ runner.temp }}/rc-reports'}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always() && vars.PRESCORE_UPLOAD_EVIDENCE == '1'
        with:
          name: rc-container-${{ needs.candidate.outputs.sha }}
          path: ${{ runner.temp }}/rc-reports/*.json
          if-no-files-found: error
  artifacts:
    env:
      PRESCORE_TEST_SHA: ${{ needs.candidate.outputs.sha }}
      PRESCORE_CANDIDATE_SELECTION: ${{ needs.candidate.outputs.selection }}
      RC_BUILD_TIMESTAMP: ${{ needs.candidate.outputs.timestamp }}
    if: vars.PRESCORE_UPLOAD_EVIDENCE == '1'
    runs-on: ubuntu-latest
    needs: [candidate, static, product-regression, postgres, container]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {ref: "${{ needs.candidate.outputs.sha }}", persist-credentials: false}
      - name: Verify exact candidate checkout
        run: test "$(git rev-parse HEAD)" = "$PRESCORE_TEST_SHA"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '22'}
      - run: npm ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: rc-*-${{ needs.candidate.outputs.sha }}
          path: ${{ runner.temp }}/rc-manifest/reports
      - name: Deterministic release evidence / CycloneDX
        run: node --experimental-strip-types scripts/release/manifest.mjs "$RUNNER_TEMP/rc-manifest"
        env:
          PRESCORE_SOURCE_SHA: ${{ needs.candidate.outputs.sha }}
          PRESCORE_BUILD_TIMESTAMP: ${{ needs.candidate.outputs.timestamp }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: prescore-rc1-release-${{ needs.candidate.outputs.sha }}
          path: ${{ runner.temp }}/rc-manifest/
          if-no-files-found: error
