name: Prescore CLIENT V2 isolated QA
on:
  push:
    branches: [prescore-client-v2-overview-v1]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: client-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  client:
    if: github.repository == 'Teddy1-blip/Prescore-v1.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: node --experimental-strip-types --test tests/public-passport.test.mjs tests/owner-preview-access.test.mjs tests/client-navigation-links.test.mjs tests/client-banking-v2.test.mjs tests/client-bfo-checko-entry.test.mjs tests/complete-client-frontend.test.mjs tests/bank-statement-metrics-v2.test.mjs tests/bank-xlsx-intake-v01.test.mjs tests/bank-xlsx-multisheet.test.mjs tests/account51-card.test.mjs tests/accounting-xlsx-source-boundaries.test.mjs tests/bank-statements.test.mjs tests/transaction-normalization.test.mjs tests/bfo-ocr-readiness.test.mjs tests/ocr-financial-sparse-pass.test.mjs tests/financial-extraction-layout.test.mjs tests/financial-ocr-missing-header.test.mjs tests/bfo-fns-package-scope.test.mjs
      # Production Dockerfile installs python3-xlrd; provision the same
      # dependency for the isolated XLS 97–2003 smoke gate.
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-xlrd
          python3 -I -c "import xlrd; print('CI xlrd version:', xlrd.__version__)"
      - run: node --experimental-strip-types scripts/qa/legacy-xls-smoke.mjs
